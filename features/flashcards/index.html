    <style>
      body {
        margin: 0;

      .section-tabs {
        margin: 6px auto 0;
        display: flex;
        gap: 18px;

        align-items: flex-end;
        padding-bottom: 6px;
        border-bottom: 1px solid rgba(106, 92, 255, 0.18);
      }

        .section-tabs {
          justify-content: flex-start;
        }
      }
      .section-tab {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 2px;
        border: 0;
        background: transparent;
        font-weight: 700;

        text-decoration: none;

        color: rgba(29, 27, 43, 0.9);
      }
      .section-tab.active {
        color: rgba(29, 27, 43, 0.98);
      }
      .section-tab.active::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: -7px;
        height: 2px;
        border-radius: 999px;
        background: linear-gradient(90deg, #6a5cff, #a7d8ff);
      }
      .management-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        border-bottom: 1px solid rgba(15, 23, 42, 0.12);
        padding-bottom: 8px;
      }
      .management-tab {
        position: relative;
        padding: 6px 2px;
        border: 0;
        background: transparent;
        font-weight: 600;
        color: rgba(29, 27, 43, 0.6);
        cursor: pointer;
      }
      .management-tab:hover {
        color: rgba(29, 27, 43, 0.9);
      }
      .management-tab.active {
        color: rgba(29, 27, 43, 0.98);
      }
      .management-tab.active::after {
        content: "";

        left: 0;
        right: 0;

        width: 100%;

        transform: rotateY(180deg);
      }
      .card-face {
        position: relative;
        grid-area: 1 / 1;
        width: 100%;
        min-height: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        box-sizing: border-box;
        word-break: break-word;
      }
      .card-face.card-back {

        // =========================
        // Helpers
        // =========================
        const DAY = 24 * 60 * 60 * 1000;
        const nowISO = () => new Date().toISOString();
        const isDue = (iso) => !iso || new Date(iso).getTime() <= Date.now();
        const fmtDateTime = (iso) => {
          if (!iso) return 'now';
          return new Intl.DateTimeFormat('en-US', {
            dateStyle: 'medium',
            timeStyle: 'short'
          }).format(new Date(iso));
        };
        const fmtRelativeReviewTime = (iso) => {
          if (!iso) return 'now';
          const deltaMs = new Date(iso).getTime() - Date.now();
          const totalMinutes = Math.max(1, Math.round(deltaMs / (60 * 1000)));
          if (totalMinutes < 60) return `${totalMinutes} min`;

          const totalHours = Math.max(1, Math.round(totalMinutes / 60));
          if (totalHours < 24) return `${totalHours} h`;

          const totalDays = Math.max(1, Math.round(totalHours / 24));
          if (totalDays < 7) return `${totalDays} d`;
          if (totalDays < 30) return `${Math.max(1, Math.round(totalDays / 7))} wk`;
          return `${Math.max(1, Math.round(totalDays / 30))} mo`;
        };
        const daysBetween = (a, b) => Math.max(0, Math.round((new Date(b).getTime() - new Date(a).getTime()) / DAY));

        function uid(prefix = 'id') {
          return `${prefix}_${Math.random().toString(36).slice(2, 10)}_${Date.now().toString(36)}`;
        }

        // =========================
        // Scheduler estilo Anki-lite
        // =========================
        function previewScheduling(card, rating) {
          const next = scheduleCard({ ...card }, rating, true);
          return next.due_at;
        }

        function scheduleCard(card, rating, previewOnly = false) {
          const currentState = card.state;
          const prevDue = card.due_at || nowISO();
          const now = new Date();
          const out = { ...card };

          const setDueMinutes = (m) => {
            out.due_at = new Date(now.getTime() + m * 60 * 1000).toISOString();
            out.scheduled_days = 0;
          };
          const setDueDays = (d) => {
            out.due_at = new Date(now.getTime() + d * DAY).toISOString();
            out.scheduled_days = d;
          };

          if (rating === 'again') {
            out.lapses += currentState === 'review' ? 1 : 0;
            out.state = currentState === 'review' ? 'relearning' : 'learning';
            out.stability = Math.max(0, Number(out.stability || 0) * 0.5);
            out.difficulty = Math.min(10, Number(out.difficulty || 5) + 0.8);
            setDueMinutes(1);
          } else if (currentState === 'new') {
            if (rating === 'hard') {
              out.state = 'learning';
              out.stability = 1;
              out.difficulty = 6;
              setDueMinutes(10);
            }
            if (rating === 'good') {
              out.state = 'learning';
              out.stability = 2;
              out.difficulty = 5;
              setDueMinutes(15);
            }
            if (rating === 'easy') {
              out.state = 'review';
              out.stability = 4;
              out.difficulty = 3.5;
              setDueDays(4);
            }
          } else if (currentState === 'learning' || currentState === 'relearning') {
            if (rating === 'hard') {
              out.state = currentState;
              out.stability = Math.max(1, Number(out.stability || 1) + 0.4);
              out.difficulty = Math.min(10, Number(out.difficulty || 5) + 0.2);
              setDueMinutes(20);
            }
            if (rating === 'good') {
              out.state = 'review';
              out.stability = Math.max(2, Number(out.stability || 2) + 1);
              out.difficulty = Math.max(1, Number(out.difficulty || 5) - 0.2);
              setDueDays(Math.max(1, Math.round(Number(out.stability))));
            }
            if (rating === 'easy') {
              out.state = 'review';
              out.stability = Math.max(3, Number(out.stability || 2) + 2);
              out.difficulty = Math.max(1, Number(out.difficulty || 5) - 0.5);
              setDueDays(Math.max(3, Math.round(Number(out.stability) + 2)));
            }
          } else if (currentState === 'review') {
            const currentInterval = Math.max(1, Number(out.scheduled_days || daysBetween(out.last_review_at || prevDue, prevDue) || 1));
            if (rating === 'hard') {
              const nextInterval = Math.max(1, Math.round(currentInterval * 1.2));
              out.stability = Math.max(2, Number(out.stability || currentInterval) + 0.5);
              out.difficulty = Math.min(10, Number(out.difficulty || 5) + 0.15);
              setDueDays(nextInterval);
            }
            if (rating === 'good') {
              const nextInterval = Math.max(2, Math.round(currentInterval * 2.5));
              out.stability = Math.max(nextInterval, Number(out.stability || currentInterval) * 1.4);
              out.difficulty = Math.max(1, Number(out.difficulty || 5) - 0.1);
              setDueDays(nextInterval);
            }
            if (rating === 'easy') {
              const nextInterval = Math.max(4, Math.round(currentInterval * 3.5));
              out.stability = Math.max(nextInterval, Number(out.stability || currentInterval) * 1.8);
              out.difficulty = Math.max(1, Number(out.difficulty || 5) - 0.25);
              setDueDays(nextInterval);
            }
          }

          if (!previewOnly) {
            out.reps = Number(out.reps || 0) + 1;
            out.elapsed_days = card.last_review_at ? daysBetween(card.last_review_at, nowISO()) : 0;
            out.last_review_at = nowISO();
            out.updated_at = nowISO();
          }

          return out;
        }

        function getQueue(cards) {
          const dueCards = cards.filter((c) => c.state !== 'suspended' && isDue(c.due_at));
          const newCards = dueCards.filter((c) => c.state === 'new');
          const learningCards = dueCards.filter((c) => c.state === 'learning' || c.state === 'relearning');
          const reviewCards = dueCards.filter((c) => c.state === 'review');
          return [...learningCards, ...reviewCards, ...newCards];
        }

        // =========================
        // Supabase API
        // =========================
        async function loadProfileById(profileId) {
          const { data, error } = await supabase.
          from('profiles').
          select('*').
          eq('id', profileId).
          maybeSingle();

          if (error) throw error;
          return data;
        }

        async function resolveProfileFromPatreon(patreonUserId) {
          const { data: existing, error } = await supabase.
          from('profiles').
          select('*').
          eq('patreon_user_id', patreonUserId).
          maybeSingle();

          if (error) throw error;
          if (existing?.id) return existing;

          const { data: created, error: createError } = await supabase.
          from('profiles').
          insert({ patreon_user_id: patreonUserId }).
          select('*').
          single();

          if (!createError) return created;
          if (createError.code !== '23505') {
            console.error('Failed to create profile for patreon_user_id:', patreonUserId, createError);
            throw new Error(`Could not create profile for Patreon user ${patreonUserId}. ${createError.message || 'Insert failed.'}`);
          }

          const { data: fallback, error: fallbackError } = await supabase.
          from('profiles').
          select('*').
          eq('patreon_user_id', patreonUserId).
          maybeSingle();

          if (fallbackError) throw fallbackError;
          if (!fallback?.id) throw new Error(`Could not resolve profile for Patreon user ${patreonUserId}.`);
          return fallback;
        }

        async function loadDeckBySlug(slug, profileId) {
          const insertPayload = {
            slug,
            title: 'Vietnamese Core A1',
            owner_id: profileId
          };

          const { data: existing, error } = await supabase.
          from('decks').
          select('*').
          eq('slug', slug).
          eq('owner_id', profileId).
          maybeSingle();

          if (error) {
            console.error('Failed to load deck by slug.', { slug, profileId, insertPayload, error });
            throw new Error('Could not load default deck.');
          }
          if (existing) return existing;

          const { data: created, error: createError } = await supabase.
          from('decks').
          insert(insertPayload).
          select('*').
          maybeSingle();

          if (!createError && created) return created;
          if (createError) {
            if (createError.status === 409 || createError.code === '23505') {
              const { data: fallback, error: fallbackError } = await supabase.
              from('decks').
              select('*').
              eq('slug', slug).
              eq('owner_id', profileId).
              maybeSingle();

              if (fallbackError) {
                console.error('Failed to reload deck after conflict.', { slug, profileId, insertPayload, error: fallbackError });
                throw new Error('Could not load default deck.');
              }
              if (fallback) return fallback;
            }

            console.error('Failed to create default deck.', {
              slug,
              profileId,
              error: createError,
              insertPayload
            });
            throw new Error('Could not load default deck.');
          }

          console.error('Default deck insert returned no data.', { slug, profileId, insertPayload });
          throw new Error('Could not load default deck.');
        }

        async function loadNotes(deckId, profileId) {
          const { data, error } = await supabase.
          from('notes').
          select('*, category:deck_categories(id, name)').
          eq('deck_id', deckId).
          eq('owner_id', profileId).
          order('sort_order', { ascending: true }).
          order('created_at', { ascending: true });

          if (error) throw error;
          return data || [];
        }

          eq('is_active', true).

          if (error) throw error;
          return (data || []).map(normalizeStudyCard).filter((card) => card.noteId);
        }

        async function createNoteWithCard(deckId, form, profileId) {
          const { data: note, error: noteError } = await supabase.
          from('notes').
          insert({
            deck_id: deckId,
            owner_id: profileId,
            type: 'basic',
            fields: {
              front: form.front,
              back: form.back,
              example_vi: form.example_vi,
              example_en: form.example_en,
              hint: form.hint

            tags: parseTags(form.tags),
            sort_order: Date.now()
          }).
          select('*, category:deck_categories(id, name)').

          if (noteError) throw noteError;

          const { data: card, error: cardError } = await supabase.
          from('cards').
          insert({
            note_id: note.id,
            deck_id: deckId,
            card_ord: 0,
            template_name: 'Basic',
            is_active: true
          }).
          select().
          single();

          if (cardError) throw cardError;
          return {
            note,
            card: normalizeStudyCard({ ...card, note })
          };
        }

        async function updateNote(noteId, form, profileId) {
          const { data, error } = await supabase.
          from('notes').
          update({
            fields: {
              front: form.front,
              back: form.back,
              example_vi: form.example_vi,
              example_en: form.example_en,
              hint: form.hint
            },
            category_id: form.category_id || null,
            tags: parseTags(form.tags),
            updated_at: nowISO()
          }).
          eq('id', noteId).
          eq('owner_id', profileId).
          select('*, category:deck_categories(id, name)').
          single();

          if (error) throw error;
          return data;
        }

        async function deleteNoteCascade(noteId, profileId) {
          const { data: cards, error: cardsError } = await supabase.
          from('cards').
          select('id, note:notes!inner(owner_id)').
          eq('note_id', noteId).
          eq('note.owner_id', profileId);
          if (cardsError) throw cardsError;

          const cardIds = (cards || []).map((c) => c.id);

          if (cardIds.length) {
            const { error: logsError } = await supabase.
            from('review_logs').
            delete().
            in('card_id', cardIds).
            eq('profile_id', profileId);
            if (logsError) throw logsError;

            const { error: progressError } = await supabase.
            from('study_progress').
            delete().
            in('card_id', cardIds).
            eq('profile_id', profileId);
            if (progressError) throw progressError;

            const { error: deleteCardsError } = await supabase.
            from('cards').
            delete().
            in('id', cardIds);
            if (deleteCardsError) throw deleteCardsError;
          }

          const { error: noteError } = await supabase.
          from('notes').
          delete().
          eq('id', noteId).
          eq('owner_id', profileId);
          if (noteError) throw noteError;

          return { noteId, cardIds };
        }

        async function saveReview(profileId, card, nextCard, rating) {
          const cardId = card?.cardId || card?.id;
          if (!cardId) {
            console.error('Missing real cards.id for review submission.', card);
            throw new Error('Could not save the review because cards.id is missing.');
          }

          const reviewedAt = nowISO();
          const progressPayload = {
            profile_id: profileId,
            card_id: cardId,
            state: nextCard.state,
            due_at: nextCard.due_at,
            last_review_at: nextCard.last_review_at,
            stability: nextCard.stability,
            difficulty: nextCard.difficulty,
            elapsed_days: nextCard.elapsed_days,
            scheduled_days: nextCard.scheduled_days,
            reps: nextCard.reps,
            lapses: nextCard.lapses,
            updated_at: reviewedAt
          };

          const { error: upsertError } = await supabase.
          from('study_progress').
          upsert(progressPayload, { onConflict: 'profile_id,card_id' });
          if (upsertError) throw upsertError;

          const { error: logError } = await supabase.
          from('review_logs').
          insert({
            id: uid('rev'),
            profile_id: profileId,
            card_id: cardId,
            reviewed_at: reviewedAt,
            rating,
            state_before: card.state,
            state_after: nextCard.state,
            due_before: card.due_at,
            due_after: nextCard.due_at,
            scheduled_days_before: card.scheduled_days,
            scheduled_days_after: nextCard.scheduled_days,
            elapsed_days: nextCard.elapsed_days
          });
          if (logError) throw logError;
        }

        function parseTags(raw) {
          return (raw || '').
          split(',').
          map((s) => s.trim()).
          filter(Boolean);
        }

        function sortCategories(items) {
          return [...items].sort((a, b) => a.name.localeCompare(b.name));
        }

        function sortNotes(items) {
          return [...items].sort((a, b) => {
            const left = Number(a.sort_order || 0);
            const right = Number(b.sort_order || 0);
            if (left !== right) return left - right;
            return new Date(a.created_at || 0).getTime() - new Date(b.created_at || 0).getTime();
          });
        }

        function sortStudyCards(items) {
          return [...items].sort((a, b) => {
            const left = Number(a.sort_order || 0);
            const right = Number(b.sort_order || 0);
            if (left !== right) return left - right;
            return new Date(a.created_at || 0).getTime() - new Date(b.created_at || 0).getTime();
          });
        }

        function normalizeStudyCard(cardRow) {
          const note = cardRow?.note || null;
          const noteId = cardRow?.note_id || note?.id || null;
          return {
            ...cardRow,
            cardId: cardRow?.id || null,
            noteId,
            note_id: noteId,
            note
          };
        }

            example_vi: '',
            example_en: '',
            hint: '',
            tags: '',
            category_id: ''
          };
        }

          const tones = {
            blue: 'bg-blue-50 text-blue-700 border-blue-200',
            amber: 'bg-amber-50 text-amber-700 border-amber-200',
            emerald: 'bg-emerald-50 text-emerald-700 border-emerald-200',
            slate: 'bg-slate-50 text-slate-700 border-slate-200'
          };
          return (/*#__PURE__*/
            React.createElement("div", { className: `rounded-2xl border px-4 py-3 ${tones[tone || 'slate']}` }, /*#__PURE__*/
            React.createElement("div", { className: "text-xs uppercase tracking-wide" }, label), /*#__PURE__*/
            React.createElement("div", { className: "text-2xl font-bold mt-1" }, value)
            ));

        }

        function WordForm({ value, onChange, onSubmit, submitText, onCancel, categories }) {
