name: Fetch captions

on:
  workflow_dispatch:
  push:
    paths:
      - "videos.json"

jobs:
  captions:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm install

      - name: Fetch captions
        run: node scripts/fetch_captions.js

      - name: Commit captions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add captions/*.vtt || true
          git commit -m "Update captions" || echo "No changes"
          git push

