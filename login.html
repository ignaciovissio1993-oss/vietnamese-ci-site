<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login</title>
  <style>
    :root {
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: #f6f7fb;
      color: #1f2430;
      display: grid;
      place-items: center;
    }
    .card {
      width: min(420px, 92vw);
      background: #ffffff;
      border: 1px solid #e6e9f2;
      border-radius: 14px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 10px 28px rgba(20, 24, 38, 0.08);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 20px;
      letter-spacing: 0.2px;
    }
    p {
      margin: 0 0 18px;
      color: #5a6274;
      font-size: 14px;
    }
    a.button {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 999px;
      background: #1f6feb;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
    }
    a.button:hover { background: #1b5fd1; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Members Login</h1>
    <p>Please continue to Patreon to verify your membership.</p>
    <a class="button" href="/auth/login?to=/">Continue to Patreon</a>
  </main>
</body>
</html>
