<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Vietnamese CI</title>
<style>
body{font-family:Arial;margin:0;background:#f3f3f7}
header{padding:20px;font-size:22px;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;padding:20px}
.card{background:white;border-radius:14px;box-shadow:0 4px 10px rgba(0,0,0,0.1);cursor:pointer;overflow:hidden}
.card img{width:100%;display:block}
.card h3{font-size:15px;padding:10px}
#playerSection{padding:20px;display:none}
#playerWrapper{position:relative;padding-bottom:56.25%;height:0}
#playerWrapper iframe{position:absolute;top:0;left:0;width:100%;height:100%}
#captions{background:white;margin-top:20px;padding:15px;border-radius:12px;max-height:300px;overflow:auto;font-size:14px;line-height:1.6}
.caption-line{padding:3px 0;cursor:pointer}
.caption-line.active{background:#dbeafe}
.error{color:red;padding:10px}
</style>
</head>
<body>

<header>Vietnamese CI</header>

<div id="videos" class="grid"></div>

<div id="playerSection">
<div id="playerWrapper"></div>
<div id="captions">Loading captions...</div>
</div>

<script>
const API_KEY = "PASTE_YOUR_NEW_API_KEY_HERE";
const CHANNEL_ID = "YOUR_CHANNEL_ID_HERE"; 

const videosContainer = document.getElementById("videos");
const playerSection = document.getElementById("playerSection");
const playerWrapper = document.getElementById("playerWrapper");
const captionsBox = document.getElementById("captions");

let currentVideoId = null;
let captionData = [];
let player;

async function loadVideos() {
  try {
    const res = await fetch(
      `https://www.googleapis.com/youtube/v3/search?key=${API_KEY}&channelId=${CHANNEL_ID}&part=snippet&type=video&maxResults=50`
    );
    const data = await res.json();

    if (!data.items) throw new Error("Invalid API response");

    data.items.forEach(item => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <img src="${item.snippet.thumbnails.medium.url}">
        <h3>${item.snippet.title}</h3>
      `;
      card.onclick = () => openVideo(item.id.videoId);
      videosContainer.appendChild(card);
    });
  } catch (e) {
    videosContainer.innerHTML = `<div class="error">Could not load from YouTube API. Check API key restrictions.</div>`;
  }
}

function openVideo(videoId) {
  currentVideoId = videoId;
  playerSection.style.display = "block";
  playerWrapper.innerHTML = `
    <iframe src="https://www.youtube.com/embed/${videoId}?enablejsapi=1"
    frameborder="0" allowfullscreen></iframe>
  `;
  loadCaptions(videoId);
}

async function loadCaptions(videoId) {
  try {
    const res = await fetch(`./captions/${videoId}.srt`);
    if (!res.ok) throw new Error("No captions");
    const text = await res.text();
    parseSRT(text);
  } catch {
    captionsBox.innerHTML = "No captions found for this video.";
  }
}

function parseSRT(data) {
  captionData = [];
  captionsBox.innerHTML = "";
  const blocks = data.split("\n\n");
  blocks.forEach(block => {
    const lines = block.split("\n");
    if (lines.length >= 3) {
      const time = lines[1];
      const text = lines.slice(2).join(" ");
      const [start] = time.split(" --> ");
      const seconds = toSeconds(start);
      captionData.push({seconds, text});
      const div = document.createElement("div");
      div.className = "caption-line";
      div.innerText = text;
      div.onclick = () => {
        player.seekTo(seconds);
      };
      captionsBox.appendChild(div);
    }
  });
}

function toSeconds(time) {
  const parts = time.replace(",",".").split(":");
  return (+parts[0])*3600 + (+parts[1])*60 + parseFloat(parts[2]);
}

loadVideos();
</script>

</body>
</html>
