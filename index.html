<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Lazy Vietnamese | Playlists</title>

<style>
:root{
  --bg:#0b1020;
  --panel:#101a33;
  --panel2:#0f1730;
  --muted:#9fb0d0;
  --text:#eaf0ff;
  --accent:#7aa7ff;
  --accent2:#4fe3c2;
  --danger:#ff6b8b;
  --border:rgba(255,255,255,.08);
  --shadow:0 20px 60px rgba(0,0,0,.35);
  --radius:18px;
  --radius2:14px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:var(--sans);
  color:var(--text);
  background: var(--bg);
  min-height:100vh;
}

header{
  position:sticky;
  top:0;
  backdrop-filter: blur(10px);
  background: rgba(11,16,32,.9);
  border-bottom:1px solid var(--border);
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:800;
}

.logo{
  width:40px;
  height:40px;
  border-radius:12px;
  background: linear-gradient(135deg, #7aa7ff, #4fe3c2);
}

.wrap{
  max-width:1400px;
  margin:0 auto;
  padding:18px;
}

.grid{
  display:grid;
  grid-template-columns: 340px 1fr;
  gap:16px;
}

@media (max-width: 980px){
  .grid{grid-template-columns:1fr}
}

.card{
  border:1px solid var(--border);
  border-radius:var(--radius);
  background: var(--panel);
  overflow:hidden;
}

.cardHeader{
  padding:14px;
  border-bottom:1px solid var(--border);
}

.list{
  max-height: calc(100vh - 180px);
  overflow:auto;
}

.item{
  display:flex;
  gap:12px;
  padding:12px;
  border-bottom:1px solid rgba(255,255,255,.06);
  cursor:pointer;
}

.item:hover{background: rgba(122,167,255,.08)}
.item.active{background: rgba(79,227,194,.12)}

.thumb{
  width:84px;
  height:48px;
  border-radius:10px;
  overflow:hidden;
  flex:0 0 auto;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.title{
  font-size:13px;
  font-weight:700;
  margin:0;
}

.playerArea{
  padding:14px;
  display:grid;
  grid-template-columns: 1fr 420px;
  gap:14px;
}

@media (max-width:1200px){
  .playerArea{grid-template-columns:1fr}
}

.playerBox{
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  border-radius:var(--radius);
  overflow:hidden;
}

#player{
  width:100%;
  height:100%;
}

.transcript{
  max-height:520px;
  overflow:auto;
  padding:12px;
  line-height:1.45;
}

.cue{
  padding:6px;
  border-radius:10px;
  cursor:pointer;
}

.cue.active{
  background: rgba(79,227,194,.18);
}
</style>
</head>
<body>

<header>
  <div class="topbar">
    <div class="brand">
      <div class="logo"></div>
      Lazy Vietnamese
    </div>
  </div>
</header>

<div class="wrap">
  <div class="grid">

    <section class="card">
      <div class="cardHeader">
        <h3>Playlists</h3>
      </div>
      <div class="list" id="playlistList"></div>
    </section>

    <section class="card">
      <div class="playerArea">
        <div>
          <div class="playerBox">
            <div id="player"></div>
          </div>
        </div>

        <div class="transcript" id="transcript">
          Select a video
        </div>
      </div>

      <div class="list" id="videoList"></div>
    </section>

  </div>
</div>


<script>
const API_KEY = "AIzaSyDPN8gism2gUu8hA-N8_hNJjm5B3krMSMY";
const CHANNEL_ID = "UCvf88neE9Erym8EF_z5KQhg";
const CAPTIONS_DIR = "captions";

let playlists = [];
let videos = [];
let player;
let cues = [];
let activeCue = -1;

const $ = id => document.getElementById(id);

// Load YT API
const tag = document.createElement("script");
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);

window.onYouTubeIframeAPIReady = function(){
  player = new YT.Player("player", {
    height:"100%",
    width:"100%",
    videoId:"",
    playerVars:{rel:0},
    events:{
      onStateChange: e=>{
        if(e.data===1) startSync();
      }
    }
  });
};

async function fetchPlaylists(){
  const res = await fetch(
    `https://www.googleapis.com/youtube/v3/playlists?part=snippet&channelId=${CHANNEL_ID}&maxResults=50&key=${API_KEY}`
  );
  const data = await res.json();
  playlists = data.items || [];
  renderPlaylists();
}

function renderPlaylists(){
  const list = $("playlistList");
  list.innerHTML="";
  playlists.forEach(p=>{
    const row=document.createElement("div");
    row.className="item";
    row.innerHTML=`<div class="thumb">
      <img src="${p.snippet.thumbnails.medium.url}">
    </div>
    <div class="title">${p.snippet.title}</div>`;
    row.onclick=()=>loadVideos(p.id,p.snippet.title);
    list.appendChild(row);
  });
}

async function loadVideos(pid,title){
  const res = await fetch(
    `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&playlistId=${pid}&maxResults=50&key=${API_KEY}`
  );
  const data = await res.json();
  videos=data.items||[];
  renderVideos();
}

function renderVideos(){
  const list=$("videoList");
  list.innerHTML="";
  videos.forEach(v=>{
    const id=v.snippet.resourceId.videoId;
    const row=document.createElement("div");
    row.className="item";
    row.innerHTML=`<div class="thumb">
      <img src="${v.snippet.thumbnails.medium.url}">
    </div>
    <div class="title">${v.snippet.title}</div>`;
    row.onclick=()=>selectVideo(id);
    list.appendChild(row);
  });
}


async function selectVideo(id){
  player.loadVideoById(id);
  loadCaptions(id);
}

async function loadCaptions(id){
  try{
    const res=await fetch(`${CAPTIONS_DIR}/${id}.srt`);
    const text=await res.text();
    cues=parseSRT(text);
    renderTranscript();
  }catch{
    $("transcript").innerHTML="No captions found.";
  }
}

function parseSRT(data){
  const blocks=data.split("\n\n");
  return blocks.map(b=>{
    const lines=b.split("\n");
    if(lines.length>=3){
      const times=lines[1].split(" --> ");
      return{
        start:toSec(times[0]),
        end:toSec(times[1]),
        text:lines.slice(2).join(" ")
      };
    }
  }).filter(Boolean);
}

function toSec(t){
  const p=t.replace(",",".").split(":");
  return (+p[0])*3600+(+p[1])*60+parseFloat(p[2]);
}

function renderTranscript(){
  const box=$("transcript");
  box.innerHTML="";
  cues.forEach((c,i)=>{
    const div=document.createElement("div");
    div.className="cue";
    div.innerText=c.text;
    div.onclick=()=>player.seekTo(c.start,true);
    div.dataset.i=i;
    box.appendChild(div);
  });
}

function startSync(){
  setInterval(()=>{
    if(!player||!cues.length)return;
    const t=player.getCurrentTime();
    for(let i=0;i<cues.length;i++){
      if(t>=cues[i].start && t<=cues[i].end){
        setActive(i);
        break;
      }
    }
  },200);
}

function setActive(i){
  if(i===activeCue)return;
  const prev=document.querySelector(".cue.active");
  if(prev)prev.classList.remove("active");
  const cur=document.querySelector(`.cue[data-i="${i}"]`);
  if(cur){
    cur.classList.add("active");
    cur.scrollIntoView({block:"center",behavior:"smooth"});
  }
  activeCue=i;
}

fetchPlaylists();
</script>

</body>
</html>
