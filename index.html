<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vietnamese CI Website</title>

  <style>
    /* ====== Your existing styles (unchanged) ====== */
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:#0b0f14;
      color:#fff;
    }

    /* ... (everything you had) ... */

    /* SERIES MODAL */
    .series-modal{
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(0,0,0,.75);
      backdrop-filter: blur(6px);
    }
    .series-modalCard{
      width: min(1200px, 96vw);
      max-height: min(92vh, 920px);
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 14px;
      background: rgba(18,24,34,.92);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,.45);
    }
    .series-modalLeft{
      padding: 14px;
      display:flex;
      flex-direction:column;
      gap: 12px;
      overflow:auto;
    }
    .series-modalRight{
      padding: 14px;
      border-left: 1px solid rgba(255,255,255,.10);
      overflow:auto;
    }
    .series-player{
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 14px;
      overflow: hidden;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
    }
    .series-player iframe{
      width: 100%;
      height: 100%;
      border: 0;
      display:block;
    }

    /* Captions under the video (from /captions/<VIDEO_ID>.srt) */
    .series-captionsBox{
      width: min(1100px, 92vw);
      background: rgba(0,0,0,.55);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 14px;
      padding: 12px 14px;
      max-height: 42vh;
      overflow: auto;
    }
    .series-captionsHeader{
      display:flex; align-items:center; justify-content:space-between;
      gap:10px; margin-bottom:10px;
    }
    .series-captionsHeader .capTitle{
      font-weight:700;
      opacity:.95;
    }
    .series-captionsHeader .capMeta{
      font-size: 12px;
      opacity: .75;
      white-space: nowrap;
    }
    .series-captions{
      display:flex;
      flex-direction:column;
      gap:10px;
      font-size: 18px;
      line-height: 1.6;
    }
    .capLine{
      padding: 8px 10px;
      border-radius: 10px;
      cursor: pointer;
      transition: background .15s ease, transform .05s ease;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.06);
    }
    .capLine:hover{ background: rgba(255,255,255,.07); }
    .capLine:active{ transform: scale(.99); }
    .capLine.active{
      background: rgba(255,255,255,.14);
      border-color: rgba(255,255,255,.22);
      box-shadow: 0 0 0 1px rgba(255,255,255,.12) inset;
    }
    .capLine .capTime{
      font-size: 12px;
      opacity: .7;
      margin-bottom: 4px;
    }

    /* ... keep the rest of your original CSS ... */
  </style>
</head>

<body>

  <!-- ====== Your existing HTML (unchanged) ====== -->
  <!-- ... your page content ... -->

  <!-- SERIES MODAL -->
  <div class="series-modal" id="series-modal" aria-hidden="true">
    <div class="series-modalCard" role="dialog" aria-modal="true" aria-label="Series Video Modal">
      <div class="series-modalLeft" id="series-modalBack">
        <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:12px;">
          <div>
            <div id="series-modalTitle" style="font-size:20px; font-weight:800; margin-bottom:4px;">Title</div>
            <div id="series-modalMeta" style="opacity:.78; font-size:13px;">Meta</div>
          </div>
          <button id="series-closeBtn" style="cursor:pointer; border:1px solid rgba(255,255,255,.15); background:rgba(255,255,255,.06); color:#fff; border-radius:10px; padding:8px 10px;">
            Close
          </button>
        </div>

        <div class="series-player" id="series-playerBox"></div>

        <!-- NEW: captions panel under the video -->
        <div class="series-captionsBox" id="series-captionsBox" style="display:none;">
          <div class="series-captionsHeader">
            <div class="capTitle">Subtitles</div>
            <div class="capMeta" id="capMeta"></div>
          </div>
          <div class="series-captions" id="series-captions"></div>
        </div>
      </div>

      <div class="series-modalRight">
        <div id="series-filterChips" style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;"></div>
        <div id="series-modalList" style="display:flex; flex-direction:column; gap:8px;"></div>
      </div>
    </div>
  </div>

  <!-- ====== Your existing scripts (with modifications) ====== -->
  <script>
    // ===== Your existing JS variables/data should stay here =====
    // (Leaving the rest of your file as-is. Only the video-open part is upgraded.)

    // Example element refs (keep yours if they already exist):
    const seriesModal = document.getElementById("series-modal");
    const seriesPlayerBox = document.getElementById("series-playerBox");
    const seriesModalTitle = document.getElementById("series-modalTitle");
    const seriesModalMeta = document.getElementById("series-modalMeta");
    const seriesModalList = document.getElementById("series-modalList");
    const seriesModalBack = document.getElementById("series-modalBack");
    const seriesCloseBtn = document.getElementById("series-closeBtn");

    // ===== YouTube player + captions (SRT) =====
    let ytPlayer = null;
    let ytApiReady = false;
    let ytApiPromise = null;

    let capCues = [];
    let capTimer = null;
    let lastActiveIndex = -1;

    function ensureYouTubeApi(){
      if (ytApiPromise) return ytApiPromise;

      ytApiPromise = new Promise((resolve) => {
        if (window.YT && window.YT.Player) {
          ytApiReady = true;
          resolve();
          return;
        }
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        window.onYouTubeIframeAPIReady = () => {
          ytApiReady = true;
          resolve();
        };
      });

      return ytApiPromise;
    }

    function destroyPlayer(){
      try { if (capTimer) clearInterval(capTimer); } catch(_){}
      capTimer = null;
      lastActiveIndex = -1;
      capCues = [];

      const capBox = document.getElementById('series-captionsBox');
      const capEl  = document.getElementById('series-captions');
      const capMeta = document.getElementById('capMeta');
      if (capEl) capEl.innerHTML = '';
      if (capMeta) capMeta.textContent = '';
      if (capBox) capBox.style.display = 'none';

      try { if (ytPlayer && ytPlayer.destroy) ytPlayer.destroy(); } catch(_){}
      ytPlayer = null;
    }

    function parseSrtTimeToSeconds(t){
      const m = t.trim().match(/^(\d+):(\d+):(\d+)[,\.](\d+)$/);
      if (!m) return 0;
      const hh = parseInt(m[1],10);
      const mm = parseInt(m[2],10);
      const ss = parseInt(m[3],10);
      const ms = parseInt(m[4].padEnd(3,'0').slice(0,3),10);
      return hh*3600 + mm*60 + ss + (ms/1000);
    }

    function fmtTime(sec){
      sec = Math.max(0, sec);
      const mm = Math.floor(sec/60);
      const ss = Math.floor(sec%60);
      return `${mm}:${String(ss).padStart(2,'0')}`;
    }

    function parseSrt(srtText){
      const text = (srtText || '').replace(/\r/g,'').trim();
      const blocks = text.split(/\n\n+/);
      const cues = [];
      for (const block of blocks){
        const lines = block.split('\n').filter(Boolean);
        if (lines.length < 2) continue;

        let timeLineIdx = 0;
        if (/^\d+$/.test(lines[0].trim())) timeLineIdx = 1;

        const timeLine = lines[timeLineIdx] || '';
        const tm = timeLine.match(/(\d+:\d+:\d+[,\.]\d+)\s*-->\s*(\d+:\d+:\d+[,\.]\d+)/);
        if (!tm) continue;

        const start = parseSrtTimeToSeconds(tm[1]);
        const end   = parseSrtTimeToSeconds(tm[2]);

        const textLines = lines.slice(timeLineIdx+1)
          .join('\n')
          .replace(/<\/?[^>]+>/g,'')
          .trim();

        if (!textLines) continue;
        cues.push({ start, end, text: textLines });
      }
      return cues;
    }

    function renderCaptions(cues){
      const capBox = document.getElementById('series-captionsBox');
      const capEl  = document.getElementById('series-captions');
      const capMeta = document.getElementById('capMeta');
      if (!capBox || !capEl) return;

      capEl.innerHTML = '';
      capCues = cues || [];
      lastActiveIndex = -1;

      if (!capCues.length){
        capBox.style.display = 'none';
        if (capMeta) capMeta.textContent = '';
        return;
      }

      capBox.style.display = 'block';
      if (capMeta) capMeta.textContent = `${capCues.length} lines`;

      capCues.forEach((c, i) => {
        const div = document.createElement('div');
        div.className = 'capLine';
        div.dataset.i = String(i);
        div.dataset.start = String(c.start);
        div.innerHTML = `
          <div class="capTime">${fmtTime(c.start)} - ${fmtTime(c.end)}</div>
          <div class="capText"></div>
        `;
        div.querySelector('.capText').textContent = c.text;

        div.addEventListener('click', () => {
          if (ytPlayer && ytPlayer.seekTo) {
            ytPlayer.seekTo(c.start + 0.01, true);
            if (ytPlayer.playVideo) ytPlayer.playVideo();
          }
        });

        capEl.appendChild(div);
      });
    }

    async function loadCaptionsForVideoId(videoId){
      const capBox = document.getElementById('series-captionsBox');
      const capEl  = document.getElementById('series-captions');
      const capMeta = document.getElementById('capMeta');

      if (capEl) capEl.innerHTML = '';
      if (capMeta) capMeta.textContent = 'Loading subtitles...';
      if (capBox) capBox.style.display = 'block';

      const url = `captions/${videoId}.srt`; // <-- naming convention
      try{
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const srt = await res.text();
        const cues = parseSrt(srt);
        renderCaptions(cues);
        if (!cues.length && capMeta) capMeta.textContent = 'No subtitles found in SRT.';
      }catch(err){
        if (capMeta) capMeta.textContent = `No subtitles file: ${url}`;
        if (capEl) capEl.innerHTML = '';
      }
    }

    function startCaptionSync(){
      if (!ytPlayer || !capCues.length) return;
      if (capTimer) clearInterval(capTimer);

      capTimer = setInterval(() => {
        if (!ytPlayer || !ytPlayer.getCurrentTime) return;

        const t = ytPlayer.getCurrentTime();

        if (lastActiveIndex >= 0 && lastActiveIndex < capCues.length){
          const c = capCues[lastActiveIndex];
          if (t >= c.start && t <= c.end) return;
        }

        let found = -1;
        const start = Math.max(0, (lastActiveIndex === -1 ? 0 : lastActiveIndex - 4));
        const end = Math.min(capCues.length-1, (lastActiveIndex === -1 ? 30 : lastActiveIndex + 30));

        for (let i = start; i <= end; i++){
          const c = capCues[i];
          if (t >= c.start && t <= c.end){ found = i; break; }
        }
        if (found === -1){
          for (let i = 0; i < capCues.length; i++){
            const c = capCues[i];
            if (t >= c.start && t <= c.end){ found = i; break; }
          }
        }

        if (found !== lastActiveIndex){
          const capEl = document.getElementById('series-captions');
          if (!capEl) return;

          const prev = capEl.querySelector('.capLine.active');
          if (prev) prev.classList.remove('active');

          if (found >= 0){
            const cur = capEl.querySelector(`.capLine[data-i="${found}"]`);
            if (cur){
              cur.classList.add('active');
              cur.scrollIntoView({ block: 'center', behavior: 'smooth' });
            }
          }
          lastActiveIndex = found;
        }
      }, 250);
    }

    // === THIS is the key: open video by ID => creates a controllable YT player + loads captions/ID.srt ===
    function seriesOpenVideo(v){
      seriesModalTitle.textContent = v.title;
      seriesModalMeta.textContent = `${v.duration} • ${v.level}`;

      destroyPlayer();
      seriesPlayerBox.innerHTML = `<div id="ytPlayerMount" style="width:100%; aspect-ratio:16/9; border-radius:14px; overflow:hidden;"></div>`;

      // load captions in parallel
      loadCaptionsForVideoId(v.id);

      ensureYouTubeApi().then(() => {
        ytPlayer = new YT.Player('ytPlayerMount', {
          videoId: v.id,
          playerVars: {
            autoplay: 1,
            rel: 0,
            modestbranding: 1,
            playsinline: 1
          },
          events: {
            onReady: () => startCaptionSync(),
            onStateChange: (e) => {
              if (window.YT && e.data === YT.PlayerState.PLAYING) startCaptionSync();
            }
          }
        });
      }).catch(() => {
        // fallback iframe (captions show but no auto-sync)
        seriesPlayerBox.innerHTML = `
          <iframe
            src="https://www.youtube.com/embed/${v.id}?rel=0&modestbranding=1"
            title="${v.title}"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
          </iframe>`;
      });

      // mark active in list (if you use it)
      Array.from(seriesModalList.querySelectorAll('.series-videoItem')).forEach(el=>{
        el.classList.toggle('active', el.dataset.id===v.id);
      });

      seriesModalBack.scrollTop = 0;
    }

    // OPTIONAL: wire close button properly (and destroy player)
    seriesCloseBtn.addEventListener("click", () => {
      destroyPlayer();
      seriesModal.style.display = "none";
      seriesModal.setAttribute("aria-hidden","true");
    });

    // ====== The rest of your existing JS stays exactly as you had it ======
    // Your code that opens the modal should set:
    // seriesModal.style.display = "flex";
    // seriesModal.setAttribute("aria-hidden","false");
    //
    // And when you call seriesOpenVideo({id,title,duration,level}) it will now:
    // - load captions/correct-id.srt
    // - render captions under the player
    // - highlight current line using timestamps.

  </script>
</body>
</html>
